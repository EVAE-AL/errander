[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "errander"
version = "0.1.0"
description = "A tiny terminal coding agent in pure Python. No framework — just the agent loop, readable in one sitting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EVAE-AL" }]
keywords = ["agent", "llm", "cli", "tool-use", "openai", "minimal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
errander = "errander.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/errander"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
